# DeepSeek Harness (dsh) + Caddy + Authelia — 通用 NAS 部署
#
# 三个容器都用 host 网络，容器里的 127.0.0.1 就是 NAS 宿主本身：
#   浏览器 ── https://dsh.example.com ──> Caddy
#              ├── forward_auth ──> Authelia (127.0.0.1:9091，双因素登录)
#              └── reverse_proxy ──> dsh (127.0.0.1:3080)
#   dsh 出站（LLM API / 联网搜索）──> 宿主代理 127.0.0.1:7890
#
# 部署（任何支持 Docker Compose 的环境）：
#   1. 把本目录放到 NAS 上（SSH 或共享文件夹）
#   2. 按 README 改 Caddyfile 和 authelia/*.yml 里的域名/密钥/密码
#   3. mkdir -p data/dsh data/workspace && chown -R 1000:1000 data
#   4. docker compose up -d --build（主方案加 --profile auth 启动 Authelia）
#   5. 浏览器访问 https://dsh.example.com

services:
  dsh:
    build:
      context: .
      args:
        DSH_VERSION: "0.1.0-rc.6"
    image: dsh:local
    container_name: dsh
    network_mode: host        # 直通宿主的代理端口；dsh 绑定 127.0.0.1（entrypoint.sh）
    # 网页端「升级 dsh」需要驱动宿主 Docker；DOCKER_GID 由 deploy.sh 写入 .env。
    # docker.sock 访问等价宿主 root 权限，必须保持 Caddy + Authelia 鉴权链路。
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      - NODE_USE_ENV_PROXY=1          # 让 Node fetch 读取代理变量（必须）
      # 运行时代理地址由 .env 的 DSH_PROXY 覆盖（deploy.sh --proxy-host 会写入）；
      # docker compose 会自动读取项目目录下的 .env 做变量插值
      - HTTP_PROXY=${DSH_PROXY:-http://127.0.0.1:7890}
      - HTTPS_PROXY=${DSH_PROXY:-http://127.0.0.1:7890}
      - NO_PROXY=127.0.0.1,localhost  # 本地流量不走代理；连局域网 Ollama 时把其 IP 追加进来
    volumes:
      # DSH 数据（配置/凭据/会话/存储），属主 UID 1000
      - ./data/dsh:/home/node/.dsh
      # 可写工作区（Web 目录选择器的新建操作落点），属主 UID 1000
      - ./data/workspace:/workspace
      # 网页端升级只读当前版本与升级日志；实际改文件/执行 deploy.sh 在一次性升级容器内完成。
      - ./Dockerfile:/opt/dsh-nas/Dockerfile:ro
      - ./docker-compose.yml:/opt/dsh-nas/docker-compose.yml:ro
      - ./data:/opt/dsh-nas/data:ro
      # 驱动宿主 Docker daemon（等价宿主 root 权限，见上方安全说明）。
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 仅主方案（域名 + Authelia）启动：docker compose --profile auth up -d。
  # 纯内网 Basic Auth 方案不启动本服务（否则带占位配置会无限重启）。
  # 固定 v4.39（官方当前稳定版）：configuration.yml 按此编写（v4.39 已移除 trusted_proxies）。
  authelia:
    image: authelia/authelia:4.39
    container_name: authelia
    profiles:
      - auth
    network_mode: host        # 只监听 127.0.0.1:9091（见 configuration.yml）
    volumes:
      - ./authelia:/config
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: dsh-caddy
    network_mode: host        # 直接监听宿主的 80/443（直连）或 13080（反代入口/内网备选）
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data    # Let's Encrypt 证书，持久化
      - ./caddy/config:/config
    depends_on:
      dsh:
        condition: service_healthy
    restart: unless-stopped
